<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="YouTube">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<title>YouTube</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:flex;align-items:center;justify-content:center;min-height:100svh}
main{text-align:center;padding:24px}
.logo{width:76px;height:76px;margin:0 auto 20px;background:#fff;border-radius:22px;display:grid;place-items:center}
.logo svg{width:48px;height:48px}
p{font-size:15px;color:#aaa;margin:0 0 22px}
a{display:inline-block;background:#fff;color:#000;text-decoration:none;padding:13px 24px;border-radius:999px;font-size:16px;font-weight:700}
</style>
</head>
<body>
<main>
<div class="logo" aria-label="YouTube"><svg viewBox="0 0 48 48" aria-hidden="true"><rect x="3" y="9" width="42" height="30" rx="9" fill="#000"/><path d="M21 16.5 33 24 21 31.5Z" fill="#fff"/></svg></div>
<p>YouTube • versi web ringan</p>
<a href="https://m.youtube.com/">Buka YouTube</a>
</main>
<script>
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>
</body>
</html>
